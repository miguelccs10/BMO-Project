version: '3.8'

services:
  bmo:
    build:
      context: .
      dockerfile: Dockerfile
    image: bmo-assistant:latest
    container_name: bmo
    restart: unless-stopped

    # Porta do servidor web
    ports:
      - "5000:5000"

    # Volumes para persistência
    volumes:
      # Configurações (edite localmente, reflete no container)
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./config/prompts.yaml:/app/config/prompts.yaml:ro
      - ./.env:/app/.env:ro

      # Credenciais (pasta local mapeada)
      - ./credentials:/app/credentials:ro

      # Modelos customizados (wake-word, voice samples)
      - ./custom_models:/app/custom_models:rw

      # Cache do Spotify (persistente)
      - bmo_cache:/app/.cache

      # Arquivos temporários (opcional, para debug)
      - ./temp:/app/temp:rw

    # Variáveis de ambiente (sobrescrevem .env se necessário)
    environment:
      - BMO_MODE=server
      - PYTHONUNBUFFERED=1
      # Adicione outras variáveis aqui se necessário
      # - GROQ_API_KEY=sua_chave_aqui

    # Para acesso a dispositivos de áudio (modo autônomo)
    # Descomente se quiser usar BMO.py no Docker
    # devices:
    #   - /dev/snd:/dev/snd

    # Recursos (opcional, ajuste conforme necessário)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Rede
    networks:
      - bmo_network

# Volumes nomeados
volumes:
  bmo_cache:
    driver: local

# Rede
networks:
  bmo_network:
    driver: bridge
