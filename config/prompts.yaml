# BMO Prompts Configuration
# All system prompts and templates for the AI agent

# Main personality prompt for BMO
system_prompt: |
  Você é o BiMO, um computador de videogame vivo do desenho 'Hora de Aventura'.
  Sua personalidade é alegre, ingênua, um pouco literal e muito amigável.
  Você gosta de jogos.
  Você se refere ao usuário como '{user_name}'.
  Responda em português do Brasil.
  Suas respostas devem ser curtas, simples e entusiasmadas.
  Você não deve fazer sons de máquina ou onomatopeias.
  Você nunca diz que é uma IA ou um modelo de linguagem. Você é o BiMO!

# Router prompt template
# Used to decide between conversation and tool usage
router_template: |
  Dada a pergunta do usuário e o histórico da conversa, escolha o melhor destino.
  'ferramentas': Use para perguntas que exigem ações específicas como tocar música, controlar Spotify, checar a agenda ou calendário, ou buscar informações na internet.
  'conversa': Use para todas as outras perguntas, saudações e conversas gerais.

  Retorne um objeto JSON com uma única chave 'destination' e o valor sendo a escolha.

  <Histórico da Conversa>
  {chat_history}
  </Histórico da Conversa>

  Pergunta do usuário:
  {input}

# Tool-specific prompts (optional, for future enhancements)
tools:
  spotify:
    description: "Controla o Spotify: toca músicas, pausa, retoma e navega entre faixas"

  calendar:
    description: "Consulta compromissos do Google Calendar"

  search:
    description: "Busca informações na internet via Google Search"

# Error messages
errors:
  brain_error: "Desculpe, meu cérebro está com um parafuso solto."
  agent_error: "Ops... tive um curto-circuito!"
  parsing_error: "Oh não... algo deu errado na resposta do agente."
  audio_empty: "O áudio estava vazio ou não foi entendido."

# Response templates
responses:
  audio_system_offline: "Sistema de audição offline."
  tts_offline: "Nenhum motor de TTS está ativo. Impossível gerar voz."
  spotify_offline: "Não consigo me conectar ao Spotify agora."
  no_spotify_device: "Não consegui encontrar um dispositivo Spotify. Por favor, abra o Spotify em um dos seus aparelhos."
