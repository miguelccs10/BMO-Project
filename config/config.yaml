# BMO Configuration File
# Main configuration for the BMO voice assistant

# Project metadata
project:
  name: "BMO"
  version: "4.1"
  user_name: "Miguel"

# LLM Configuration
llm:
  provider: "groq"
  model_name: "llama-3.1-8b-instant"

  # Temperature settings for different use cases
  temperatures:
    router: 0.0      # Precise routing decisions
    agent: 0.7       # Creative responses with tools
    conversation: 0.7 # Natural conversation flow

  # Agent execution settings
  agent:
    max_iterations: 5
    verbose: true
    handle_parsing_errors: true

# Text-to-Speech Configuration
tts:
  engine: "google"  # Options: google, coqui, elevenlabs

  google:
    voice_name: "pt-BR-Chirp3-HD-Erinome"
    language_code: "pt-BR"
    audio_encoding: "MP3"

  coqui:
    model: "tts_models/multilingual/multi-dataset/xtts_v2"
    voice_sample_path: "bmo_voice_sample.wav"
    language: "pt"
    split_sentences: true

  elevenlabs:
    voice_id: ""  # Configure if using ElevenLabs

# Speech-to-Text Configuration
stt:
  provider: "groq"
  model: "whisper-large-v3"
  language: "pt"

# Wake Word Detection
wake_word:
  model_path: "custom_models/wake_word/Talos.onnx"
  threshold: 0.5
  inference_framework: "onnx"

  # Audio settings for wake word detection
  audio:
    sample_rate: 16000
    chunk_size: 1280  # 80ms at 16kHz
    channels: 1
    format: "int16"

# Audio Recording Settings
recording:
  duration_seconds: 5  # Fallback if VAD is disabled
  sample_rate: 16000
  channels: 1
  chunk_size: 1280
  format: "int16"
  input_device_index: null  # null = default, or specify device index

  # Buffer management
  buffer_clear_duration_ms: 500

  # Voice Activity Detection (VAD)
  vad:
    enabled: true
    threshold: 0.5  # Speech probability threshold (0.0 - 1.0)
    min_speech_duration_ms: 250  # Minimum speech duration to start recording
    min_silence_duration_ms: 700  # Silence duration to stop recording
    max_recording_seconds: 30  # Maximum recording duration (safety limit)
    speech_pad_ms: 300  # Padding before speech starts

# Tools Configuration (Enable/Disable features)
tools:
  spotify:
    enabled: true  # Set to false to disable Spotify integration
  google_calendar:
    enabled: true  # Set to false to disable Google Calendar
  google_search:
    enabled: true  # Set to false to disable Google Search

# Spotify Integration
spotify:
  scope: "user-modify-playback-state,user-read-playback-state,user-read-currently-playing"
  redirect_uri: "http://127.0.0.1:9090"

# Google Calendar Integration
google_calendar:
  credentials_file: "credentials.json"
  token_file: "token.json"
  scopes:
    - "https://www.googleapis.com/auth/calendar.readonly"

# Google Cloud Configuration
google_cloud:
  adc_credentials_file: "google_adc_credentials.json"

# Flask Server Configuration
server:
  host: "0.0.0.0"
  port: 5000
  debug: false

# LangChain Settings
langchain:
  tracing_v2: false
  api_key: ""
  endpoint: "https://api.smith.langchain.com"
  project: "bmo_project"

# Paths Configuration
paths:
  base_dir: "."  # Will be set programmatically
  temp_audio: "temp_question.wav"
  response_audio_mp3: "response.mp3"
  response_audio_wav: "response.wav"
  web_folder: "web"
  custom_models: "custom_models"

# Hardware Settings (for Raspberry Pi deployments)
hardware:
  enabled: false
  gpio_led_pin: null
  display:
    enabled: false
    type: null  # e.g., "ssd1306", "st7789"
    width: 128
    height: 64
