google_calendar:
  credentials_file: credentials/credentials.json
  scopes:
  - https://www.googleapis.com/auth/calendar.readonly
  token_file: credentials/token.json
hardware:
  display:
    enabled: false
    height: 64
    type: null
    width: 128
  enabled: false
  gpio_led_pin: null
langchain:
  api_key: ''
  endpoint: https://api.smith.langchain.com
  project: bmo_project
  tracing_v2: false
llm:
  agent:
    handle_parsing_errors: true
    max_iterations: 5
    verbose: true
  cloud:
    model_name: llama-3.1-8b-instant
    provider: groq
  local:
    airllm:
      compression: null
      hf_repo: Qwen/Qwen1.5-1.8B-Chat
      max_length: 128
    base_url: http://localhost:11434
    model: qwen2:1.5b
    provider: ollama
    timeout: 120
  mode: local
  temperatures:
    agent: 0.7
    conversation: 0.7
    router: 0.0
paths:
  base_dir: .
  custom_models: custom_models
  response_audio_mp3: response.mp3
  response_audio_wav: response.wav
  temp_audio: temp_question.wav
  web_folder: web
project:
  name: BMO
  user_name: Miguel
  version: '4.1'
recording:
  buffer_clear_duration_ms: 500
  channels: 1
  chunk_size: 1280
  duration_seconds: 5
  format: int16
  input_device_index: null
  output_device_index: null
  sample_rate: 16000
  vad:
    enabled: true
    max_recording_seconds: 30
    min_silence_duration_ms: 900
    min_speech_duration_ms: 200
    speech_pad_ms: 400
    threshold: 0.4
server:
  debug: false
  host: 0.0.0.0
  port: 5000
spotify:
  redirect_uri: http://127.0.0.1:9090
  scope: user-modify-playback-state,user-read-playback-state,user-read-currently-playing
stt:
  cloud:
    language: pt
    model: whisper-large-v3
    provider: groq
  local:
    beam_size: 5
    compute_type: int8
    device: cpu
    language: pt
    model: medium
    provider: faster-whisper
  mode: local
tools:
  google_calendar:
    enabled: false
  google_search:
    enabled: false
  spotify:
    enabled: false
tts:
  coqui:
    language: pt
    model: tts_models/multilingual/multi-dataset/xtts_v2
    split_sentences: true
    voice_sample_path: bmo_voice_sample.wav
  elevenlabs:
    voice_id: ''
  engine: piper
  piper:
    length_scale: 0.85
    quality: medium
    speaker: null
    voice: /home/miguel/.local/share/piper_tts/pt_BR-faber-medium.onnx
wake_word:
  audio:
    channels: 1
    chunk_size: 1280
    format: int16
    sample_rate: 16000
  inference_framework: onnx
  model_path: custom_models/wake_word/Talos.onnx
  threshold: 0.3
