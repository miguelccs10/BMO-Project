# BMO Configuration File - Optimized for NVIDIA Jetson Orin
# This is a reference configuration for Jetson Orin NX 16GB
# Copy to config/config.yaml: cp config.jetson.yaml config/config.yaml

# Project metadata
project:
  name: "BMO"
  version: "4.1"
  user_name: "Miguel"  # ← PERSONALIZE SEU NOME

# LLM Configuration - LOCAL MODE WITH GPU
llm:
  mode: "local"  # ← 100% local, usando GPU da Jetson

  # Cloud provider (fallback se usar "hybrid")
  cloud:
    provider: "groq"
    model_name: "llama-3.1-8b-instant"

  # Local provider - OLLAMA WITH GPU
  local:
    provider: "ollama"
    model: "llama3.1:8b"  # ← Recomendado para Orin NX 16GB
    # Alternativas:
    # - "llama3.2:3b" para Orin Nano/NX 8GB (mais rápido, menos RAM)
    # - "gemma2:9b" para AGX Orin 32GB (melhor qualidade)
    base_url: "http://localhost:11434"
    timeout: 120

  # Temperature settings
  temperatures:
    router: 0.0
    agent: 0.7
    conversation: 0.7

  # Agent execution settings
  agent:
    max_iterations: 5
    verbose: true
    handle_parsing_errors: true

# Text-to-Speech Configuration - XTTS WITH GPU
tts:
  engine: "coqui"  # ← XTTS com GPU = excelente qualidade

  google:
    voice_name: "pt-BR-Chirp3-HD-Erinome"
    language_code: "pt-BR"
    audio_encoding: "MP3"

  coqui:
    model: "tts_models/multilingual/multi-dataset/xtts_v2"
    voice_sample_path: "bmo_voice_sample.wav"  # ← GRAVE SUA VOZ!
    language: "pt"
    split_sentences: true

  piper:
    voice: "pt_BR-faber-medium"
    quality: "medium"
    speaker: null
    length_scale: 1.0

  elevenlabs:
    voice_id: ""

# Speech-to-Text Configuration - LOCAL WITH GPU
stt:
  mode: "local"  # ← STT local usando GPU da Jetson

  # Cloud provider (fallback se usar "hybrid")
  cloud:
    provider: "groq"
    model: "whisper-large-v3"
    language: "pt"

  # Local provider - faster-whisper WITH GPU
  local:
    provider: "faster-whisper"
    model: "small"  # ← Recomendado para Orin NX
    # Alternativas:
    # - "tiny" para Orin Nano (mais rápido)
    # - "medium" para Orin NX 16GB (melhor qualidade)
    # - "large-v3" para AGX Orin 32GB (máxima qualidade)
    device: "cuda"  # ← IMPORTANTE: Usar GPU!
    compute_type: "float16"  # ← float16 para GPU
    language: "pt"
    beam_size: 5

# Wake Word Detection - LOCAL (OpenWakeWord)
wake_word:
  model_path: "custom_models/wake_word/Talos.onnx"
  threshold: 0.5
  inference_framework: "onnx"

  audio:
    sample_rate: 16000
    chunk_size: 1280
    channels: 1
    format: "int16"

# Audio Recording Settings - VAD ENABLED
recording:
  duration_seconds: 5  # Fallback se VAD desabilitar
  sample_rate: 16000
  channels: 1
  chunk_size: 1280
  format: "int16"

  # Audio device selection
  # Use: python list_audio_devices.py para descobrir os índices
  input_device_index: null   # null = padrão, ou especifique (ex: 2, 4)
  output_device_index: null  # null = padrão, ou especifique (ex: 3, 5)
  # Jetson Orin: USB Audio geralmente é índice 4-5
  # HDMI Audio geralmente é índice 2-3

  buffer_clear_duration_ms: 500

  # Voice Activity Detection (VAD) - RECOMENDADO
  vad:
    enabled: true  # ← Detecta automaticamente fim da fala
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 700
    max_recording_seconds: 30
    speech_pad_ms: 300

# Tools Configuration
tools:
  spotify:
    enabled: true  # ← Ajuste conforme necessidade
  google_calendar:
    enabled: true
  google_search:
    enabled: true

# Spotify Integration
spotify:
  scope: "user-modify-playback-state,user-read-playback-state,user-read-currently-playing"
  redirect_uri: "http://127.0.0.1:9090"

# Google Calendar Integration
google_calendar:
  credentials_file: "credentials.json"
  token_file: "token.json"
  scopes:
    - "https://www.googleapis.com/auth/calendar.readonly"

# Google Cloud Configuration
google_cloud:
  adc_credentials_file: "google_adc_credentials.json"

# Flask Server Configuration
server:
  host: "0.0.0.0"
  port: 5000
  debug: false

# LangChain Settings
langchain:
  tracing_v2: false
  api_key: ""
  endpoint: "https://api.smith.langchain.com"
  project: "bmo_project"

# Paths Configuration
paths:
  base_dir: "."
  temp_audio: "temp_question.wav"
  response_audio_mp3: "response.mp3"
  response_audio_wav: "response.wav"
  web_folder: "web"
  custom_models: "custom_models"

# Hardware Settings - PARA JETSON COM PERIFÉRICOS
hardware:
  enabled: false  # ← true se tiver LEDs/display conectados
  gpio_led_pin: null  # Ex: 18 para GPIO18
  display:
    enabled: false  # ← true se tiver display OLED
    type: null  # "ssd1306" ou "st7789"
    width: 128
    height: 64

# ═══════════════════════════════════════════════════════════
# NOTAS PARA JETSON ORIN:
# ═══════════════════════════════════════════════════════════
#
# 1. PERFORMANCE:
#    - Ative modo MAXN: sudo nvpmodel -m 0
#    - Maximize clocks: sudo jetson_clocks
#    - Monitore com: sudo jtop
#
# 2. MEMÓRIA:
#    - Configure swap de 8GB (ver docs/JETSON_ORIN_DEPLOYMENT.md)
#    - Uso esperado: ~10GB RAM no pico
#    - Feche outros processos durante uso
#
# 3. MODELOS:
#    - LLM: llama3.1:8b usa ~6GB RAM
#    - STT: faster-whisper small usa ~1GB RAM + GPU
#    - TTS: XTTS usa ~2.5GB RAM + GPU
#
# 4. GPU:
#    - Certifique-se que device="cuda" no STT
#    - XTTS usa GPU automaticamente se disponível
#    - Monitore uso da GPU com nvidia-smi ou jtop
#
# 5. LATÊNCIAS ESPERADAS:
#    - Wake Word: ~80ms
#    - VAD: ~1ms
#    - STT (GPU): ~300-500ms
#    - LLM: ~1-3s
#    - TTS (GPU): ~300-500ms
#    - Total: 2-5 segundos por interação
#
# 6. PRIVACIDADE:
#    - Modo 100% local = zero dados enviados para cloud
#    - Funciona completamente offline
#    - Ideal para aplicações sensíveis
#
# ═══════════════════════════════════════════════════════════
